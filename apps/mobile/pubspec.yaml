name: mobile
description: Study Collab — cross-platform mobile app for KMUTT students.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.1
  firebase_crashlytics: ^4.1.4
  firebase_remote_config: ^5.1.4
  firebase_storage: ^12.3.7

  # Media
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  file_picker: ^8.1.4
  url_launcher: ^6.3.1

  # Storage
  flutter_secure_storage: ^9.2.2

  # Images
  cached_network_image: ^3.4.1

  # Calendar
  table_calendar: ^3.1.3
  google_sign_in: ^6.2.1
  google_sign_in_web: ^0.12.4
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  crypto: ^3.0.5

  # Connectivity
  connectivity_plus: ^6.1.3

  # Utils
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.13
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.4
  riverpod_lint: ^2.6.3

  # Testing
  mocktail: ^1.0.4
  fake_cloud_firestore: ^3.0.2
  network_image_mock: ^2.1.1

  # Linting
  flutter_lints: ^5.0.0
  http: ^1.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700