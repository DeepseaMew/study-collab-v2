name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Required GitHub Actions secrets:
# FIREBASE_OPTIONS_DART        — full contents of apps/mobile/lib/firebase_options.dart
#                                Set in GitHub repo Settings → Secrets → Actions
# GOOGLE_SERVICES_JSON         — full contents of apps/mobile/android/app/google-services.json
#                                Set in GitHub repo Settings → Secrets → Actions
# GOOGLE_SIGNIN_WEB_CLIENT_ID  — OAuth 2.0 Web client ID for Google Sign-In on Web (GCal OAuth)
#                                Set in GitHub repo Settings → Secrets → Actions

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Inject firebase_options.dart
        working-directory: ${{ github.workspace }}
        run: echo "$FIREBASE_OPTIONS_DART" > apps/mobile/lib/firebase_options.dart
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}

      - name: Format injected firebase_options.dart
        working-directory: ${{ github.workspace }}
        run: dart format apps/mobile/lib/firebase_options.dart
        
      - name: Inject google-services.json
        working-directory: ${{ github.workspace }}
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > apps/mobile/android/app/google-services.json

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --fatal-warnings

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Update golden images
        run: flutter test --update-goldens --dart-define=GOOGLE_SIGNIN_WEB_CLIENT_ID=${{ secrets.GOOGLE_SIGNIN_WEB_CLIENT_ID }} test/

      - name: Unit & widget tests
        run: flutter test --coverage --test-randomize-ordering-seed random --dart-define=GOOGLE_SIGNIN_WEB_CLIENT_ID=${{ secrets.GOOGLE_SIGNIN_WEB_CLIENT_ID }}

      - name: Upload golden images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-images-linux
          path: apps/mobile/test/**/goldens/

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: apps/mobile/coverage/lcov.info
          fail_ci_if_error: false

  integration-test-android:
    name: Integration Tests (Android)
    if: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Inject firebase_options.dart
        working-directory: ${{ github.workspace }}
        run: echo "$FIREBASE_OPTIONS_DART" > apps/mobile/lib/firebase_options.dart
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}

      - name: Format injected firebase_options.dart
        working-directory: ${{ github.workspace }}
        run: dart format apps/mobile/lib/firebase_options.dart

      - name: Inject google-services.json
        working-directory: ${{ github.workspace }}
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > apps/mobile/android/app/google-services.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Cache Firebase emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('**/firebase.json') }}

      - name: Install dependencies
        run: flutter pub get
      - name: Debug — verify google-services.json
        working-directory: ${{ github.workspace }}
        run: |
          echo "=== File exists check ==="
          ls -la apps/mobile/android/app/google-services.json
          echo "=== First 5 lines ==="
          head -5 apps/mobile/android/app/google-services.json
          echo "=== JSON validity check ==="
          python3 -c "import json; json.load(open('apps/mobile/android/app/google-services.json')); print('VALID JSON')"

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Firebase login
        run: firebase login --no-localhost --token "${{ secrets.FIREBASE_TOKEN }}"
        continue-on-error: true

      - name: Run integration tests (Android emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          working-directory: ${{ github.workspace }}
          script: firebase emulators:exec --project study-collab-4d0a0 --only auth,firestore "cd apps/mobile && flutter test integration_test/auth_happy_path_test.dart --dart-define=GOOGLE_SIGNIN_WEB_CLIENT_ID=${{ secrets.GOOGLE_SIGNIN_WEB_CLIENT_ID }} && flutter test integration_test/auth_flow_test.dart --dart-define=GOOGLE_SIGNIN_WEB_CLIENT_ID=${{ secrets.GOOGLE_SIGNIN_WEB_CLIENT_ID }}"

      - name: Capture ADB logcat on failure
        if: failure()
        run: adb logcat -d -s flutter:V > /tmp/flutter_logcat.txt 2>&1 || true

      - name: Upload ADB logcat
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-flutter-logcat
          path: /tmp/flutter_logcat.txt


  integration-test-web:
    name: Integration Tests (Web)
    if: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Inject firebase_options.dart
        working-directory: ${{ github.workspace }}
        run: echo "$FIREBASE_OPTIONS_DART" > apps/mobile/lib/firebase_options.dart
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Inject Google Sign-In web client ID
        if: ${{ env.GOOGLE_SIGNIN_WEB_CLIENT_ID != '' }}
        working-directory: ${{ github.workspace }}
        env:
          GOOGLE_SIGNIN_WEB_CLIENT_ID: ${{ secrets.GOOGLE_SIGNIN_WEB_CLIENT_ID }}
        run: |
          sed -i 's|<!-- CI: inject google-signin-client_id meta tag here for GCal OAuth on Web -->|<meta name="google-signin-client_id" content="'"$GOOGLE_SIGNIN_WEB_CLIENT_ID"'">|' apps/mobile/web/index.html

      - name: Run integration tests (Web)
        working-directory: ${{ github.workspace }}
        run: |
          chromedriver --port=4444 &
          sleep 3
          firebase emulators:exec --project study-collab-4d0a0 --only auth,firestore \
            "cd apps/mobile && flutter drive \
              --driver=test_driver/integration_test.dart \
              --target=integration_test/auth_happy_path_test.dart \
              --dart-define=GOOGLE_SIGNIN_WEB_CLIENT_ID=${{ secrets.GOOGLE_SIGNIN_WEB_CLIENT_ID }} \
              -d web-server \
              --browser-name=chrome"

  firebase-emulator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Inject firebase_options.dart
        working-directory: ${{ github.workspace }}
        run: echo "$FIREBASE_OPTIONS_DART" > apps/mobile/lib/firebase_options.dart
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}

      - name: Inject google-services.json
        working-directory: ${{ github.workspace }}
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > apps/mobile/android/app/google-services.json

      - name: flutter pub get
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run auth_happy_path_test against emulators
        working-directory: .
        run: |
          firebase emulators:exec --project study-collab-4d0a0 --only auth,firestore \
            "cd apps/mobile && dart run build_runner build --delete-conflicting-outputs && flutter test integration_test/auth_happy_path_test.dart --dart-define=GOOGLE_SIGNIN_WEB_CLIENT_ID=${{ secrets.GOOGLE_SIGNIN_WEB_CLIENT_ID }} -d linux --verbose 2>&1 | head -100"