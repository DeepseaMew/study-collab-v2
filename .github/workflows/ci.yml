name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Required GitHub Actions secrets:
# FIREBASE_OPTIONS_DART  — full contents of apps/mobile/lib/firebase_options.dart
#                          Set in GitHub repo Settings → Secrets → Actions
# GOOGLE_SERVICES_JSON   — full contents of apps/mobile/android/app/google-services.json
#                          Set in GitHub repo Settings → Secrets → Actions

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Inject firebase_options.dart
        working-directory: ${{ github.workspace }}
        run: echo "$FIREBASE_OPTIONS_DART" > apps/mobile/lib/firebase_options.dart
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}

      - name: Format injected firebase_options.dart
        working-directory: ${{ github.workspace }}
        run: dart format apps/mobile/lib/firebase_options.dart

      - name: Inject google-services.json
        working-directory: ${{ github.workspace }}
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > apps/mobile/android/app/google-services.json

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --fatal-warnings

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Update golden images
        run: flutter test --update-goldens test/

      - name: Unit & widget tests
        run: flutter test --coverage --test-randomize-ordering-seed random

      - name: Upload golden images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-images-linux
          path: apps/mobile/test/**/goldens/

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: apps/mobile/coverage/lcov.info
          fail_ci_if_error: false

  integration-test-android:
    name: Integration Tests (Android)
    needs: analyze-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Inject firebase_options.dart
        working-directory: ${{ github.workspace }}
        run: echo "$FIREBASE_OPTIONS_DART" > apps/mobile/lib/firebase_options.dart
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}

      - name: Format injected firebase_options.dart
        working-directory: ${{ github.workspace }}
        run: dart format apps/mobile/lib/firebase_options.dart

      - name: Inject google-services.json
        working-directory: ${{ github.workspace }}
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > apps/mobile/android/app/google-services.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run integration tests (Android emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          working-directory: ${{ github.workspace }}
          script: firebase emulators:exec --project study-collab-4d0a0 --only auth,firestore "cd apps/mobile && flutter drive --driver=test_driver/integration_test.dart --target=integration_test/auth_happy_path_test.dart -d emulator-5554 && flutter drive --driver=test_driver/integration_test.dart --target=integration_test/auth_flow_test.dart -d emulator-5554"

  integration-test-web:
    name: Integration Tests (Web)
    needs: analyze-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Inject firebase_options.dart
        working-directory: ${{ github.workspace }}
        run: echo "$FIREBASE_OPTIONS_DART" > apps/mobile/lib/firebase_options.dart
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Run integration tests (Web)
        working-directory: ${{ github.workspace }}
        run: |
          chromedriver --port=4444 &
          sleep 3
          firebase emulators:exec --project study-collab-4d0a0 --only auth,firestore "cd apps/mobile && flutter drive --driver=test_driver/integration_test.dart --target=integration_test/auth_happy_path_test.dart -d web-server --browser-name=chrome"
