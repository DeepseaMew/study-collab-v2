name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Required GitHub Actions secrets:
# FIREBASE_OPTIONS_DART  — full contents of apps/mobile/lib/firebase_options.dart
#                          Set in GitHub repo Settings → Secrets → Actions
# GOOGLE_SERVICES_JSON   — full contents of apps/mobile/android/app/google-services.json
#                          Set in GitHub repo Settings → Secrets → Actions

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Inject firebase_options.dart
        working-directory: ${{ github.workspace }}
        run: |
          cat > apps/mobile/lib/firebase_options.dart << 'EOF'
          ${{ secrets.FIREBASE_OPTIONS_DART }}
          EOF

      - name: Inject google-services.json
        working-directory: ${{ github.workspace }}
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > apps/mobile/android/app/google-services.json

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --fatal-warnings

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Unit & widget tests
        run: flutter test --coverage --test-randomize-ordering-seed random

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: apps/mobile/coverage/lcov.info
          fail_ci_if_error: false

  integration-test-android:
    name: Integration Tests (Android)
    if: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Inject google-services.json
        working-directory: ${{ github.workspace }}
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > apps/mobile/android/app/google-services.json

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run integration tests (Android emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          working-directory: apps/mobile
          script: flutter test integration_test/

  integration-test-web:
    name: Integration Tests (Web)
    if: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Run integration tests (Web)
        run: |
          chromedriver --port=4444 &
          flutter test integration_test/ -d web-server --browser-name=chrome

  firebase-emulator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Inject firebase_options.dart
        working-directory: ${{ github.workspace }}
        run: |
          cat > apps/mobile/lib/firebase_options.dart << 'EOF'
          ${{ secrets.FIREBASE_OPTIONS_DART }}
          EOF

      - name: Inject google-services.json
        working-directory: ${{ github.workspace }}
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > apps/mobile/android/app/google-services.json

      - name: flutter pub get
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run auth_happy_path_test against emulators
        working-directory: .
        run: |
          firebase emulators:exec --only auth,firestore \
            "cd apps/mobile && flutter test integration_test/auth_happy_path_test.dart"